name: Playwright Tests

on:
  # -------------------------------------------------
  # Chạy khi push lên 2 branch chính
  # -------------------------------------------------
  push:
    branches: [main, develop]

  # -------------------------------------------------
  # Hỗ trợ merge queue (merge_group event)
  # -------------------------------------------------
  merge_group:
    branches: [main, develop]

  # -------------------------------------------------
  # Cho phép chạy tay
  # -------------------------------------------------
  workflow_dispatch:

  # -------------------------------------------------
  # Cron chạy mỗi ngày lúc 01:00 UTC
  # -------------------------------------------------
  schedule: # VNTIME = + 9h40
    - cron: "0 23 * * *"

jobs:
  test:
    # -------------------------------------------------
    # Giới hạn tối đa 60 phút cho toàn bộ job test
    # -------------------------------------------------
    timeout-minutes: 60
    runs-on: ubuntu-latest

    # -------------------------------------------------
    # Resolve GitHub Environment cho job
    #
    # Quy ước:
    # - main    -> staging
    # - develop -> develop
    # - cron    -> staging
    #
    # Lý do dùng github.ref + startsWith:
    # - merge_group tạo ref đặc biệt
    # - tránh sai khi dùng github.ref_name
    # -------------------------------------------------
    environment: ${{ github.event_name == 'schedule' && 'staging' || github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'main' && 'staging' || github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'develop' && 'develop' || startsWith(github.ref, 'refs/heads/main') && 'staging' || startsWith(github.ref, 'refs/heads/develop') && 'develop' }}

    # -------------------------------------------------
    # Chạy song song 4 shard
    # -------------------------------------------------
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    env:
      # -------------------------------------------------
      # vars.* lấy từ GitHub Environment đã resolve ở trên
      # (staging hoặc develop)
      # -------------------------------------------------
      ENV: ${{ vars.ENV }}
      BASE_URL: ${{ vars.BASE_URL }}

      # -------------------------------------------------
      # secrets dùng chung cho cả 2 environment
      # -------------------------------------------------
      EMAIL: ${{ secrets.EMAIL }}
      PASSWORD: ${{ secrets.PASSWORD }}

    steps:
      # -------------------------------------------------
      # Checkout đúng branch đang trigger workflow
      # (cron vẫn checkout main)
      # -------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      # -------------------------------------------------
      # Cài NodeJS (LTS) + cache npm
      # -------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      # -------------------------------------------------
      # Cài dependency theo package-lock.json
      # -------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # -------------------------------------------------
      # Cài browser cho Playwright
      # -------------------------------------------------
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # -------------------------------------------------
      # Chạy test theo từng shard
      # --reporter=blob để tạo report trung gian
      # dùng cho bước merge phía sau
      # -------------------------------------------------
      - name: Run Playwright tests (Shard ${{ matrix.shard }})
        run: |
          npx playwright test \
            --shard=${{ matrix.shard }}/4 \
            --reporter=blob \
            --retries=1

      # -------------------------------------------------
      # Upload blob report của từng shard
      # -------------------------------------------------
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 1


  # -------------------------------------------------
  # Job merge report từ tất cả shard
  # -------------------------------------------------
  merge-report:
    if: always()
    needs: test
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------
      # Checkout repo để dùng playwright CLI
      # -------------------------------------------------
      - uses: actions/checkout@v5

      # -------------------------------------------------
      # Cài NodeJS
      # -------------------------------------------------
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      # -------------------------------------------------
      # Cài dependency để có playwright CLI
      # -------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # -------------------------------------------------
      # Download toàn bộ blob report từ các shard
      # -------------------------------------------------
      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports

      # -------------------------------------------------
      # Gom toàn bộ file blob vào 1 folder
      # vì playwright merge-reports yêu cầu
      # tất cả blob nằm chung 1 thư mục
      # -------------------------------------------------
      - name: Prepare blob reports
        run: |
          mkdir merged-blobs
          find all-blob-reports -type f -exec cp {} merged-blobs/ \;

      # -------------------------------------------------
      # Merge blob report thành report HTML + JSON
      # -------------------------------------------------
      - name: Merge reports
        run: |
          npx playwright merge-reports \
            --reporter html,json \
            ./merged-blobs

      # -------------------------------------------------
      # Upload report đã merge
      # dùng cho job deploy-report phía sau
      # -------------------------------------------------
      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7


  # -------------------------------------------------
  # Deploy report lên GitHub Pages
  #
  # Chạy khi:
  # - branch là main hoặc develop
  # - cron cũng được deploy
  #
  # Lưu ý:
  # - report của main / develop / cron dùng chung 1 site
  # - chạy sau sẽ đạp report của lần chạy trước
  # -------------------------------------------------
  deploy-report:
    needs: merge-report
    if: always() && github.event_name != 'merge_group'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    steps:
      # -------------------------------------------------
      # Download report đã merge
      # -------------------------------------------------
      - name: Download final report
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: ./public

      # -------------------------------------------------
      # Upload artifact cho GitHub Pages
      # -------------------------------------------------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      # -------------------------------------------------
      # Deploy lên GitHub Pages
      # -------------------------------------------------
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4


  # -------------------------------------------------
  # Gửi thông báo Slack
  # -------------------------------------------------
  notify-slack:
    needs: [test, merge-report, deploy-report]
    runs-on: ubuntu-latest
    if: always()
    continue-on-error: true
    environment: slack

    steps:
      - name: Send Slack notification
        shell: bash
        run: |
          set -e

          RESULT="${{ needs.test.result }}"

          if [ "$RESULT" = "success" ]; then
            STATUS="PASSED"
            COLOR="#36a64f"
            ICON="✅"
          else
            STATUS="FAILED"
            COLOR="#ff0000"
            ICON="❌"
          fi

          BRANCH="${{ github.event_name == 'merge_group' && github.event.merge_group.base_ref || github.ref_name }}"

          ACTION_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          REPORT_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

          curl -s -X POST \
            -H "Content-type: application/json" \
            --data @- \
            "${{ secrets.SLACK_WEBHOOK_URL }}" <<EOF
          {
            "attachments": [
              {
                "color": "$COLOR",
                "title": "Playwright CI $STATUS $ICON",
                "fields": [
                  { "title": "Repository", "value": "${{ github.repository }}", "short": true },
                  { "title": "Branch", "value": "$BRANCH", "short": true },
                  { "title": "Actions", "value": "$ACTION_URL", "short": false },
                  { "title": "Report", "value": "$REPORT_URL", "short": false }
                ]
              }
            ]
          }
          EOF


  # -------------------------------------------------
  # Gửi thông báo Telegram
  # -------------------------------------------------
  notify-telegram:
    needs: [test, merge-report, deploy-report]
    runs-on: ubuntu-latest
    if: always()
    continue-on-error: true

    steps:
      - name: Send Telegram notification
        run: |
          RESULT="${{ needs.test.result }}"

          if [ "$RESULT" = "success" ]; then
            STATUS="PASSED"
            ICON="✅"
          else
            STATUS="FAILED"
            ICON="❌"
          fi

          BRANCH="${{ github.event_name == 'merge_group' && github.event.merge_group.base_ref || github.ref_name }}"

          ACTION_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          REPORT_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

          MESSAGE=$(printf "<b>🎭 Playwright CI %s %s</b>\n\nRepository: %s\nBranch: %s\n\n🔗 Actions: %s\n📈 Report: %s" \
            "$STATUS" \
            "$ICON" \
            "${{ github.repository }}" \
            "$BRANCH" \
            "$ACTION_URL" \
            "$REPORT_URL")

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            --data-urlencode text="$MESSAGE"
